<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorized Web Archive</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">LOCAL · READ ONLY</p>
        <h1>Authorized Web Archive</h1>
        <p class="lede">Records captured by an explicit user action from the allowlisted demo origin.</p>
      </header>
      <section class="layout" aria-live="polite">
        <ol id="records" class="records"></ol>
        <article id="detail" class="detail">
          <p>Select an archived page.</p>
        </article>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
